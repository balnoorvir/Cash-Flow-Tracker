<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cash Flow Form</title>
    <link rel="stylesheet" href="design.css">
</head>
<body>
   
    <h1 class="pageTitle">Start tracking your Expenses</h1>
    <form id="cashFlowForm">
        <h2 class="formTitle"> Enter your details here</h2>
    <div class="salarySpace">
        <label for="salary">Total Salary</label>
        <input
            type="number"
            id="salary"
            name="salary"
            placeholder="Enter your total salary"
        >
    </div>

    <div class="expenseNameSpace">
        <label for="expenseName">Expense Name</label>
        <input
            type="text"
            id="expenseName"
            name="expenseName"
            placeholder="Enter expense name"
            
        >
    </div>

    <div class="expenseAmountSpace">
        <label for="expenseAmount">Expense Amount</label>
        <input
            type="number"
            id="expenseAmount"
            name="expenseAmount"
            placeholder="Enter expense amount"
        
        >
    </div>
<p id="errorMessage"></p>
    <button type="submit">Add Expense</button>

</form>
<section class="summary">

    <div>
        <h3>Total Salary</h3>
        <p id="totalSalary">₹0</p>
    </div>

    <div>
        <h3>Total Expenses</h3>
        <p id="totalExpenses">₹0</p>
    </div>

    <div>
        <h3>Remaining Balance</h3>
        <p id="remainingBalance">₹0</p>
    </div>

</section>
<div chart-container>
<canvas id="expenseChart"></canvas>
</div>
<section>

    <h2>Expense History</h2>

    <ul id="expenseList">
        <!-- Expenses will appear here -->
    </ul>

</section>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="javascript.js"></script>
</body>
</html>
